<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Carman</title>

    <link rel="stylesheet" th:href="@{/login.css}">

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<section class="login-page">

    <div class="login-box">

        <div class="logo">
            Carman
        </div>

        <h2>
            Iniciar sesión
        </h2>

        <p class="subtitle">
            Ingresa tus datos para continuar
        </p>

        <form id="login-form">

            <div class="input-group">

                <label>
                    Correo electrónico
                </label>

                <input 
                    id="login-email"
                    type="email"
                    placeholder="correo@gmail.com"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Contraseña
                </label>

                <input 
                    id="login-password"
                    type="password"
                    placeholder="********"
                    required
                >

            </div>

            <p id="login-error" class="login-error">Correo o contraseña incorrectos</p>

            <div class="extra-options">

                <label class="remember">

                    <input type="checkbox">

                    Recordarme

                </label>

                <a href="#">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Ingresar
            </button>

        </form>

        <div class="divider">
            <span>o</span>
        </div>

        <button class="google-btn">
            Continuar con Google
        </button>

        <p class="register-text">
            ¿No tienes cuenta?
            <a th:href="@{/InicioSesion}">
                Regístrate
            </a>
        </p>

    </div>

</section>

<script th:src="@{/login.js}"></script>
</body>
</html>
